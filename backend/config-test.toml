# 本地测试配置，数据库连接对应 docker-compose.yml。
[COMMON]
port = 8180
open_tls = false

[MySQL]
url = "127.0.0.1:3307"
user = "root"
pwd = "1234"
db_name = "offer_hub"

[MongoDB]
url = "mongodb://127.0.0.1:27017"
user = ""
pwd = ""
database = "offer_hub_test"
max_pool = 100
min_pool = 0

[Redis]
url = "127.0.0.1:6379"
pwd = ""
db = 0

[JWT]
# 随机生成的本地测试签名密钥。
secret = "Q7/vmDn/+D9VBfP2nwzI9LdxzS1We0I5vaoVCTq+ZSA="
# token 有效期，单位：小时。
expire = 24
# 后续 token 缓存有效期，单位小时；当前中间件仅读黑名单，不刷新 TTL。
token_cache_expire = 2
enable = true

[RateLimit]
enable = true
window_seconds = 60
max_requests = 20
